<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; media-src 'self' blob: mediastream:;"
    />
    <title>摄像头小窗</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
        -webkit-app-region: drag;
      }
      .wrap {
        position: absolute;
        inset: 6px;
        border-radius: 50%;
        overflow: hidden;
        border: 3px solid rgba(255, 255, 255, 0.88);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
        background: #111;
        -webkit-app-region: drag;
      }
      .wrap.rect {
        border-radius: 18px;
      }
      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: #111;
        pointer-events: none;
      }
      video.mirror {
        transform: scaleX(-1);
      }
      .label {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 6px 8px 10px;
        font: 600 11px/1.25 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
        color: #fff;
        text-align: center;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.72));
        pointer-events: none;
      }
      .hit {
        position: absolute;
        left: 18%;
        top: 18%;
        width: 64%;
        height: 64%;
        border-radius: 50%;
        -webkit-app-region: no-drag;
        cursor: pointer;
        background: transparent;
        border: 0;
        padding: 0;
        z-index: 2;
      }
      .wrap.rect .hit {
        border-radius: 12px;
      }
    </style>
  </head>
  <body>
    <div class="wrap" id="wrap">
      <button class="hit" id="hit" type="button" title="单击切形状 · 双击反转 · 拖动改位置" aria-label="摄像头小窗"></button>
      <video id="v" autoplay muted playsinline></video>
      <div class="label" id="label">拖动 · 单击切形 · 双击反转</div>
    </div>
    <script>
      const api = window.macRecorderPip;
      const video = document.getElementById("v");
      const label = document.getElementById("label");
      const wrap = document.getElementById("wrap");
      const hit = document.getElementById("hit");
      let stream = null;
      let clickTimer = null;
      let lastTap = 0;
      let ptr = null;

      function isPhoneCam(name) {
        const l = String(name || "").toLowerCase();
        return (
          /iphone|ipad|ipod|continuity|desk\s*view/.test(l) ||
          /连.?互通|接续|随航|手机/.test(String(name || ""))
        );
      }

      function applyConfig(cfg) {
        const shape = cfg?.shape === "rect" ? "rect" : "circle";
        const mirrored = cfg?.mirrored !== false;
        wrap.classList.toggle("rect", shape === "rect");
        video.classList.toggle("mirror", mirrored);
        label.textContent =
          (stream ? "" : "预览占用·") +
          "拖动 · 单击切" +
          (shape === "circle" ? "方" : "圆") +
          " · 双击反转";
      }

      async function start(cmd) {
        const deviceId = cmd?.deviceId || "";
        applyConfig(cmd);
        if (stream) {
          stream.getTracks().forEach((t) => t.stop());
          stream = null;
        }
        video.srcObject = null;
        if (!deviceId) {
          label.textContent = "无电脑摄像头 · 仍可点按切换";
          return;
        }
        const attempts = [
          {
            audio: false,
            video: {
              deviceId: { ideal: deviceId },
              width: { ideal: 320 },
              height: { ideal: 320 },
              frameRate: { ideal: 24 },
            },
          },
          {
            audio: false,
            video: {
              deviceId: { exact: deviceId },
              width: { ideal: 240 },
              height: { ideal: 240 },
            },
          },
        ];
        for (const constraints of attempts) {
          try {
            const s = await navigator.mediaDevices.getUserMedia(constraints);
            const trackLabel = s.getVideoTracks()[0]?.label || "";
            if (isPhoneCam(trackLabel)) {
              s.getTracks().forEach((t) => t.stop());
              continue;
            }
            stream = s;
            video.srcObject = stream;
            await video.play().catch(() => undefined);
            applyConfig(cmd);
            return;
          } catch {
            // try next
          }
        }
        label.textContent = "监视预览占用中 · 成片仍有摄像头 · 可点按切换";
      }

      function stop() {
        if (stream) {
          stream.getTracks().forEach((t) => t.stop());
          stream = null;
        }
        video.srcObject = null;
      }

      function emitGesture(kind) {
        if (kind === "dblclick") {
          api?.sendAction("toggle-mirror");
          return;
        }
        api?.sendAction("toggle-shape");
      }

      function onTap() {
        if (clickTimer) {
          clearTimeout(clickTimer);
          clickTimer = null;
        }
        const now = performance.now();
        if (now - lastTap < 320) {
          lastTap = 0;
          emitGesture("dblclick");
          return;
        }
        lastTap = now;
        clickTimer = setTimeout(() => {
          clickTimer = null;
          lastTap = 0;
          emitGesture("click");
        }, 280);
      }

      hit.addEventListener("pointerdown", (e) => {
        ptr = { x: e.screenX, y: e.screenY, moved: false };
      });
      hit.addEventListener("pointermove", (e) => {
        if (!ptr) return;
        if (Math.hypot(e.screenX - ptr.x, e.screenY - ptr.y) > 8) ptr.moved = true;
      });
      hit.addEventListener("pointerup", () => {
        const p = ptr;
        ptr = null;
        if (!p || p.moved) return;
        onTap();
      });

      // 空白区域仍可拖动窗口（webkit drag）；点中 hit 层负责单击/双击
      wrap.addEventListener("dblclick", (e) => {
        e.preventDefault();
      });

      api?.onCommand((cmd) => {
        if (cmd?.type === "start") void start(cmd);
        if (cmd?.type === "config") applyConfig(cmd);
        if (cmd?.type === "stop") stop();
      });
    </script>
  </body>
</html>
