<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="lilyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7bff"/>
      <stop offset="0.55" stop-color="#7c6cf0"/>
      <stop offset="1" stop-color="#00c9a7"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c2c35"/>
      <stop offset="1" stop-color="#181820"/>
    </linearGradient>
  </defs>

  <!-- Badge -->
  <rect x="4" y="4" width="88" height="88" rx="24" fill="#0e0e12"/>
  <rect x="4" y="4" width="88" height="88" rx="24" fill="url(#ringGrad)" opacity="0.55"/>
  <rect x="4.75" y="4.75" width="86.5" height="86.5" rx="23.25" fill="none" stroke="url(#lilyGrad)" stroke-width="1.5" opacity="0.9"/>

  <!-- Constellation "L": connection lines -->
  <path d="M34 30 V62 H68" fill="none" stroke="url(#lilyGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>

  <!-- Orbital arc (network motif) -->
  <path d="M62 26 A30 30 0 0 1 70 38" fill="none" stroke="#00c9a7" stroke-width="2.5" stroke-linecap="round" opacity="0.55" stroke-dasharray="3 6"/>

  <!-- Nodes -->
  <circle cx="34" cy="30" r="8" fill="#0e0e12" stroke="#8b7bff" stroke-width="4"/>
  <circle cx="34" cy="62" r="8" fill="#0e0e12" stroke="#00c9a7" stroke-width="4"/>
  <circle cx="68" cy="62" r="8" fill="#0e0e12" stroke="#a99aff" stroke-width="4"/>

  <!-- Node cores -->
  <circle cx="34" cy="30" r="3" fill="#8b7bff"/>
  <circle cx="34" cy="62" r="3" fill="#00c9a7"/>
  <circle cx="68" cy="62" r="3" fill="#a99aff"/>

  <!-- AI spark at top-right of first node -->
  <path d="M52 14 l2.2 4.8 4.8 2.2 -4.8 2.2 -2.2 4.8 -2.2 -4.8 -4.8 -2.2 4.8 -2.2z" fill="#7c6cf0" opacity="0.95"/>
</svg>
